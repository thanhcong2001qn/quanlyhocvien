<!-- fragments/chatbot/chatbot.html -->
<div th:fragment="chatbot" xmlns:th="http://www.w3.org/1999/xhtml">
  <!-- Chat Toggle Button -->
  <button id="openChatBtn" class="chat-toggle-btn" aria-label="Mở trợ lý">
    <div class="btn-content">
      <i class="fas fa-robot"></i>
      <span class="btn-text">Trợ lý</span>
    </div>
  </button>

  <!-- Chat Container -->
  <div id="chatContainer" class="chat-container" style="display: none;">
    <!-- Chat Header -->
    <div id="chatHeader" class="chat-header">
      <div class="header-left">
        <div class="bot-avatar">
          <i class="fas fa-robot"></i>
          <span class="status-indicator online"></span>
        </div>
        <div class="header-info">
          <h3 class="bot-name">Trợ lý học viên</h3>
          <span class="bot-status">Sẵn sàng hỗ trợ</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="clearHistoryBtn" class="action-btn" aria-label="Xóa lịch sử trò chuyện" title="Xóa lịch sử">
          <i class="fas fa-trash-alt"></i>
        </button>
        <button id="toggleSizeBtn" class="action-btn" aria-label="Thay đổi kích thước">
          <i class="fas fa-expand"></i>
        </button>
<!--        <button id="minimizeBtn" class="action-btn" aria-label="Thu nhỏ">-->
<!--          <i class="fas fa-minus"></i>-->
<!--        </button>-->
        <button id="closeChatBtn" class="action-btn" aria-label="Đóng">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Chat Messages Area -->
    <div id="chat-messages" class="chat-messages">
    </div>

    <!-- Chat Input Area -->
    <div id="chatInputArea" class="chat-input-area">
      <form id="chat-form" class="chat-form">
        <div class="input-wrapper">
          <button type="button" class="input-action-btn" aria-label="Đính kèm file">
            <i class="fas fa-paperclip"></i>
          </button>
          <input type="text"
                 id="user-input"
                 class="chat-input"
                 placeholder="Nhập tin nhắn của bạn..."
                 autocomplete="off"
                 aria-label="Tin nhắn">
          <button type="submit" class="input-action-btn" aria-label="Gửi tin nhắn">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
        <div class="input-suggestions">
          <button type="button" class="suggestion-chip">Giới thiệu Website</button>
          <button type="button" class="suggestion-chip">Lịch học</button>
          <button type="button" class="suggestion-chip">Học phí</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Popup xác nhận xóa lịch sử -->
  <div id="chatbot-confirm-modal" class="chatbot-modal" style="display:none;">
    <div class="chatbot-modal-backdrop"></div>
    <div class="chatbot-modal-content">
      <div class="chatbot-modal-header">
        <span class="chatbot-modal-title">Xác nhận xóa lịch sử</span>
      </div>
      <div class="chatbot-modal-body">
        <p>Bạn có chắc chắn muốn xóa toàn bộ lịch sử trò chuyện?</p>
      </div>
      <div class="chatbot-modal-actions">
        <button id="chatbot-confirm-ok" class="chatbot-modal-btn chatbot-modal-ok">Xóa</button>
        <button id="chatbot-confirm-cancel" class="chatbot-modal-btn chatbot-modal-cancel">Hủy</button>
      </div>
    </div>
  </div>
</div>
