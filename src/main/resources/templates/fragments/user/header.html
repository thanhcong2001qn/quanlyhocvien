<header class="main-header shadow-sm">
    <div class="container">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid p-0">
                <div class="col-md-3">
                    <a class="navbar-brand" href="/home">
                        <span class="brand-text">MY<span class="gradient-text">LEARN</span></span>
                    </a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
                <div class="collapse navbar-collapse col-md-3" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item">
                            <a class="nav-link nav-link-header" href="/home" >Trang chủ</a>
                        </li>
                        <li class="nav-item dropdown hover-dropdown">
                            <!-- Sử dụng JavaScript để thêm token vào request -->
                            <a class="nav-link nav-link-header" href="/user/all-course">
                                Khoá học
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-header" href="#">Cộng đồng</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-header" href="#">Liên hệ</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-header" href="#">Tư vấn</a>
                        </li>
                    </ul>
                    <div class="header-buttons col-md-2">
                        <a href="/user/cart" class="btn cart-btn">
                            <i class="fas fa-shopping-cart"></i>
                            <span class="badge cart-badge" id="cartBadge">0</span>
                        </a>
                        <div class="nav-item dropdown hover-dropdown position-relative">
                            <a href="#" class="btn user-btn" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-user"></i>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end auth-dropdown" aria-labelledby="userDropdown">
                                <!-- Menu khi chưa đăng nhập -->
                                <div th:if="${#authorization.expression('!isAuthenticated()')}">
                                    <li class="auth-item not-logged-in">
                                        <a class="dropdown-item" href="/login">
                                            <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                                        </a>
                                    </li>
                                    <li class="auth-item not-logged-in">
                                        <a class="dropdown-item" href="/register">
                                            <i class="fas fa-user-plus me-2"></i>Đăng ký
                                        </a>
                                    </li>
                                </div>

                                <!-- Menu khi đã đăng nhập -->
                                <div th:if="${#authorization.expression('isAuthenticated()')}">
                                    <li class="auth-item logged-in">
                                        <a class="dropdown-item user-info" href="/user/profile">
                                            <i class="fas fa-user-circle me-2"></i>
                                            <span th:text="${#authentication.principal.username}">Username</span>
                                        </a>
                                    </li>
                                    <li class="auth-item logged-in">
                                        <a href="javascript:void(0)" onclick="logout()" class="dropdown-item text-danger">
                                            <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
                                        </a>
                                    </li>
                                </div>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</header>
