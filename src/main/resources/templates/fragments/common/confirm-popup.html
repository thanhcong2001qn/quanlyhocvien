<!-- fragments/confirm-popup.html -->
<div th:fragment="confirm-popup" xmlns:th="http://www.thymeleaf.org" id="confirmPopup" class="modal fade" tabindex="-1" aria-labelledby="confirmPopupLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmPopupLabel">Xác nhận thao tác</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="confirmPopupMessage">Bạn có chắc chắn muốn thực hiện thao tác này?</p>
      </div>
      <div class="modal-footer">
        <!-- Sửa lại nút Cancel như sau -->
        <button type="button" class="btn btn-secondary" id="cancelPopupBtn" data-bs-dismiss="modal">Hủy</button>
        <button type="button" class="btn btn-danger" id="confirmPopupBtn">Xác nhận</button>
      </div>
    </div>
  </div>
</div>
