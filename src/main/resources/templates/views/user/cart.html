<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tất cả khóa học - My Learn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/user/header.css}">
    <link th:href="@{/css/user/cart.css}" rel="stylesheet">
</head>
<body>
<!-- Main Header -->
<div th:replace="~{/fragments/user/header :: header}"></div>
<div th:replace="~{fragments/user/notification-select :: confirmation-dialog}"></div>
<div th:replace="~{fragments/user/notification :: notification}"></div>
<!-- Main Content -->
<main class="cart-page">
    <div class="container py-5">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Giỏ hàng</h1>

                <!-- Empty Cart Message -->
                <div id="emptyCartMessage" class="text-center py-5 d-none">
                    <img src="/img/empty-cart.svg" alt="Giỏ hàng trống" class="mb-3" style="width: 150px;">
                    <h3>Giỏ hàng của bạn đang trống</h3>
                    <p class="text-muted mb-4">Khám phá các khóa học để thêm vào giỏ hàng của bạn</p>
                    <a href="/user/all-course" class="btn btn-primary">Khám phá khóa học</a>
                </div>

                <!-- Cart Content -->
                <div id="cartContent">
                    <div class="row">
                        <!-- Cart Items (Left Column) -->
                        <div class="col-lg-8">
                            <div class="card mb-4">
                                <div class="card-header bg-white py-3">
                                    <div class="row align-items-center">
                                        <div class="col-6">
                                            <h5 class="mb-0">Khóa học (<span id="totalItems">0</span>)</h5>
                                        </div>
                                        <div class="col-6 text-end">
                                            <button id="clearCartBtn" class="btn btn-sm btn-outline-danger">
                                                <i class="fas fa-trash-alt me-1"></i> Xóa tất cả
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div class="card-body">
                                    <!-- Cart Items List -->
                                    <div id="cartItemsList">
                                        <!-- Cart items will be loaded here dynamically -->
                                        <div class="text-center py-4">
                                            <div class="spinner-border text-primary" role="status">
                                                <span class="visually-hidden">Đang tải...</span>
                                            </div>
                                            <p class="mt-2">Đang tải giỏ hàng...</p>
                                        </div>
                                    </div>

                                    <!-- Continue Shopping Link -->
                                    <div class="text-center mt-4">
                                        <a href="/user/all-course" class="btn btn-outline-primary">
                                            <i class="fas fa-arrow-left me-1"></i> Tiếp tục mua sắm
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Order Summary (Right Column) -->
                        <div class="col-lg-4">
                            <div class="card mb-4">
                                <div class="card-header bg-white py-3">
                                    <h5 class="mb-0">Tóm tắt đơn hàng</h5>
                                </div>
                                <div class="card-body">
                                    <div class="d-flex justify-content-between mb-3">
                                        <span>Tạm tính:</span>
                                        <span id="subtotal">0₫</span>
                                    </div>
                                    <div class="d-flex justify-content-between mb-3">
                                        <span>Giảm giá:</span>
                                        <span id="discount">0₫</span>
                                    </div>
                                    <hr>
                                    <div class="d-flex justify-content-between mb-4">
                                        <strong>Tổng cộng:</strong>
                                        <strong id="total">0₫</strong>
                                    </div>
                                    <button id="checkoutBtn" class="btn btn-primary btn-lg w-100">
                                        Thanh toán ngay
                                    </button>

                                    <!-- Payment Methods -->
                                    <div class="mt-3 text-center">
                                        <small class="text-muted">Chúng tôi chấp nhận:</small>
                                        <div class="mt-2">
                                            <i class="fab fa-cc-visa fa-2x me-2 text-muted"></i>
                                            <i class="fab fa-cc-mastercard fa-2x me-2 text-muted"></i>
                                            <i class="fab fa-cc-paypal fa-2x me-2 text-muted"></i>
                                            <i class="far fa-money-bill-alt fa-2x text-muted"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Promotions -->
                            <div class="card mb-4">
                                <div class="card-header bg-white py-3">
                                    <h5 class="mb-0">Mã khuyến mãi</h5>
                                </div>
                                <div class="card-body">
                                    <div class="input-group">
                                        <input type="text" id="promoCode" class="form-control" placeholder="Nhập mã">
                                        <button id="applyPromoBtn" class="btn btn-outline-primary">Áp dụng</button>
                                    </div>
                                    <div id="promoMessage" class="mt-2 small"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Cart Item Template -->
<template id="cartItemTemplate">
    <div class="cart-item" data-id="">
        <div class="row align-items-center">
            <div class="col-md-2 col-4 mb-3 mb-md-0">
                <img src="" alt="" class="img-fluid rounded course-img">
            </div>
            <div class="col-md-6 col-8 mb-3 mb-md-0">
                <h5 class="course-title"></h5>
                <div class="course-author text-muted small"></div>
                <div class="mt-1 d-flex align-items-center">
                    <span class="badge bg-light text-dark me-2 course-level"></span>
                    <span class="course-duration text-muted small"></span>
                </div>
            </div>
            <div class="col-md-2 col-6 text-md-end">
                <span class="original-price text-decoration-line-through text-muted small"></span>
                <div class="current-price fw-bold"></div>
            </div>
            <div class="col-md-2 col-6 text-end">
                <button class="btn btn-sm btn-outline-danger remove-item">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>
        <hr>
    </div>
</template>

<!-- Bootstrap & JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/utils/api.js}"></script>
<script th:src="@{/js/user/header.js}"></script>
<script th:src="@{/js/user/cart.js}"></script>
</body>
</html>
