<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin/header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
    <link rel="stylesheet" th:href="@{/css/admin/body.css}">
    <link rel="stylesheet" th:href="@{/css/admin/AddStudent.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="~{/fragments/header :: header}"></div>
<div th:replace="~{/fragments/menu :: menu}"></div>
<!--body-->
<div class="content-wrapper">
    <div class="container">
        <h1>Thêm Sinh Viên Mới</h1>
        <form id="studentForm">
            <div class="form-group">
                <label for="fullName">Họ tên:</label>
                <input type="text" id="fullName" name="fullName" >
                <div class="error-message" id="fullNameError">Vui lòng nhập họ tên</div>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ:</label>
                <textarea id="address" name="address" rows="3" ></textarea>
                <div class="error-message" id="addressError">Vui lòng nhập địa chỉ</div>
            </div>

            <div class="form-group">
                <label for="birthDate">Ngày sinh:</label>
                <input type="date" id="birthDate" name="birthDate" >
                <div class="error-message" id="birthDateError">Vui lòng chọn ngày sinh</div>
            </div>

            <div class="form-group">
                <label for="phoneNumber">Số điện thoại:</label>
                <input type="tel" id="phoneNumber" name="phoneNumber"
                       placeholder="Nhập số điện thoại 10 chữ số">
                <div class="error-message" id="phoneNumberError">Vui lòng nhập số điện thoại hợp lệ (10 chữ số)</div>
            </div>

            <div class="form-group">
                <button type="submit">Lưu thông tin</button>
                <button type="reset" style="background-color: #f44336;">Xóa form</button>
            </div>
        </form>

    </div>

    <script>
        document.getElementById('studentForm').addEventListener('submit', function(e) {
           // e.preventDefault();

            // Kiểm tra dữ liệu nhập vào
            const fullName = document.getElementById('fullName').value.trim();
            const address = document.getElementById('address').value.trim();
            const birthDate = document.getElementById('birthDate').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();

            let isValid = true;

            if (!fullName) {
                document.getElementById('fullNameError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('fullNameError').style.display = 'none';
            }

            if (!address) {
                document.getElementById('addressError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('addressError').style.display = 'none';
            }

            if (!birthDate) {
                document.getElementById('birthDateError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('birthDateError').style.display = 'none';
            }

            if (!phoneNumber || !/^\d{10}$/.test(phoneNumber)) {
                document.getElementById('phoneNumberError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('phoneNumberError').style.display = 'none';
            }

            if (!isValid) {
                return;
            }
            // Tạo đối tượng JSON từ dữ liệu form
            const studentData = {
                fullName: fullName,
                address: address,
                birthDate: birthDate,
                phoneNumber: phoneNumber
            };

            // Hiển thị loading hoặc thông báo đang xử lý
            const responseDiv = document.getElementById('responseMessage');
            responseDiv.style.display = 'block';
            responseDiv.style.backgroundColor = '#ffffcc';
            responseDiv.innerHTML = 'Đang gửi thông tin...';
            // Gửi dữ liệu dưới dạng JSON đến server
            fetch('/api/students', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(studentData)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Lỗi khi gửi dữ liệu: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    // Xử lý kết quả trả về từ server
                    responseDiv.style.backgroundColor = '#d4edda';
                    responseDiv.innerHTML = 'Thêm sinh viên thành công!';

                    // Xóa form sau khi gửi thành công
                    document.getElementById('studentForm').reset();

                    // Hoặc chuyển hướng sang trang khác
                    // window.location.href = '/students';
                })
                .catch(error => {
                    // Xử lý lỗi
                    responseDiv.style.backgroundColor = '#f8d7da';
                    responseDiv.innerHTML = 'Lỗi: ' + error.message;
                    console.error('Error:', error);
                });

        // Ở đây bạn có thể thêm mã JavaScript để xử lý form
            // Ví dụ: gửi dữ liệu bằng AJAX đến server

            alert('Thông tin sinh viên đã được lưu!');
            // Hoặc gửi form thực sự:
            // this.submit();
        });
    </script>

</div>
<!--body-->
<script th:src="@{/js/menu.js}"></script>
<script th:src="@{/js/header.js}"></script>
</body>
</html>
