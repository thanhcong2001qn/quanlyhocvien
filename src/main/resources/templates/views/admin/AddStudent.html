<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" th:href="@{/css/admin/header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
    <link rel="stylesheet" th:href="@{/css/admin/body.css}">
    <link rel="stylesheet" th:href="@{/css/admin/AddStudent.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="~{/fragments/admin/header :: header}"></div>
<div th:replace="~{/fragments/admin/menu :: menu}"></div>
<!--&lt;!&ndash;body&ndash;&gt;-->
<div class="content-wrapper">
    <div class="container">
        <h1>Thêm Sinh Viên Mới</h1>
        <form id="studentForm" class="row">
            <div class="form-group">
                <label for="fullName">Họ tên:</label>
                <input type="text" id="fullName" name="fullName" placeholder="Nhập tên sinh viên">
                <div class="error-message" id="fullNameError">Vui lòng nhập họ tên</div>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Nhập email sinh viên">
                <div class="error-message" id="emailError">Vui lòng nhập email hợp lệ</div>
            </div>
            <div class="form-group">
                <label for="gender">Giới tính:</label>
                <select class="form-select" name="gender" id="gender">
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dateOfBirth">Ngày sinh:</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth">
                <div class="error-message" id="birthDateError">Vui lòng chọn ngày sinh</div>
            </div>
            <div class="form-group">
                <label for="address">Địa chỉ:</label>
                <input id="address" name="address" rows="3"></input>
                <div class="error-message" id="addressError">Vui lòng nhập địa chỉ</div>
            </div>
            <div class="form-group">
                <label for="phoneNumber">Số điện thoại:</label>
                <input type="tel" id="phoneNumber" name="phoneNumber"
                       placeholder="Nhập số điện thoại 10 chữ số">
                <div class="error-message" id="phoneNumberError">Vui lòng nhập số điện thoại hợp lệ (10 chữ số)</div>
            </div>
            <div class="form-group">
                <label for="studentImage">Hình ảnh:</label>
                <input type="file" id="studentImage" class="studentImage" name="studentImage" accept="image/*">
                <button type="button" id="cameraButton" class="btn btn-primary mt-2">
                    <i class="fas fa-camera me-1"></i>Chụp ảnh
                </button>
                <div class="mt-2 mb-2" id="cameraContainer" style="display: none;">
                    <video id="cameraPreview" style="width: 100%; max-height: 300px;" autoplay></video>
                    <div class="d-flex justify-content-center mt-2">
                        <button type="button" id="captureButton" class="btn btn-success me-2">Chụp</button>
                        <button type="button" id="cancelCaptureButton" class="btn btn-secondary">Hủy</button>
                    </div>
                </div>
                <div class="mt-2" id="previewContainer" style="display: none;">
                    <div class="d-flex justify-content-center">
                        <canvas id="imagePreview"></canvas>
                    </div>
                    <div class="d-flex justify-content-center mt-2">
                        <button type="button" id="saveImageButton" class="btn btn-success me-2">Lưu ảnh</button>
                        <button type="button" id="retakeButton" class="btn btn-secondary">Chụp lại</button>
                    </div>
                </div>
                <div class="error-message" id="imageError">Vui lòng chụp một hình ảnh hợp lệ</div>
            </div>
            <div class="form-group">
                <button type="submit">Lưu thông tin</button>
                <button type="reset" id="reset-button" style="background-color: #f44336;">Xóa form</button>
            </div>

        </form>

    </div>
    <div id="popup" class="popup popup-notification" style="display: none;">
        <div class="popup-content">
            <p id="message-popup-notification"></p>
            <button id="closePopupButton">Đóng</button>
        </div>
    </div>
</div>
<!--body-->
<script th:src="@{/js/admin/menu.js}"></script>
<script th:src="@{/js/admin/header.js}"></script>
<script th:src="@{/js/admin/body.js}"></script>
<script>
    document.getElementById('studentForm').addEventListener('submit', function (e) {
        e.preventDefault();

        // Kiểm tra dữ liệu nhập vào
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const address = document.getElementById('address').value.trim();
        const dateOfBirth = document.getElementById('dateOfBirth').value.trim();
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        const gender = document.getElementById('gender').value.trim();
        const studentImage = document.getElementById('studentImage').files[0];
        let isValid = true;

        if (!fullName) {
            document.getElementById('fullNameError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('fullNameError').style.display = 'none';
        }
        if (!email) {
            document.getElementById('emailError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('emailError').style.display = 'none';
        }
        if (!address) {
            document.getElementById('addressError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('addressError').style.display = 'none';
        }

        if (!dateOfBirth) {
            document.getElementById('birthDateError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('birthDateError').style.display = 'none';
        }

        if (!phoneNumber || !/^\d{10}$/.test(phoneNumber)) {
            document.getElementById('phoneNumberError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('phoneNumberError').style.display = 'none';
        }
        if (!studentImage) {
            document.getElementById('imageError').style.display = 'block';
        } else {
            document.getElementById('imageError').style.display = 'none';
        }
        if (!isValid) {
            return;
        }
        // Tạo đối tượng JSON từ dữ liệu form
        const studentData = new FormData()

        studentData.append('student.fullName', fullName);
        studentData.append('student.email', email);
        studentData.append('student.address', address);
        studentData.append('student.dateOfBirth', dateOfBirth);
        studentData.append('student.phoneNumber', phoneNumber);
        studentData.append('student.gender', gender);
        studentData.append('file', studentImage);

        fetch('/student/apiAddStudent', {
            method: 'POST',
            body: studentData
        })
            .then(response => {
                if (response.ok && response.status === 201) {
                    showPopupNotification("Thông tin sinh viên được lưu thành công!");
                    document.getElementById('studentForm').reset();
                }
                if (response.status === 409) {
                    showPopupNotification('Email đã tồn tại trong hệ thống!');
                }
            })
    });
    document.addEventListener('DOMContentLoaded', function () {
        const studentImageInput = document.getElementById('studentImage');
        const cameraButton = document.getElementById('cameraButton');
        const cameraContainer = document.getElementById('cameraContainer');
        const previewContainer = document.getElementById('previewContainer');
        const cameraPreview = document.getElementById('cameraPreview');
        const captureButton = document.getElementById('captureButton');
        const cancelCaptureButton = document.getElementById('cancelCaptureButton');
        const imagePreview = document.getElementById('imagePreview');
        const saveImageButton = document.getElementById('saveImageButton');
        const retakeButton = document.getElementById('retakeButton');
        const resetButton = document.getElementById('reset-button');
        let stream = null;

        resetButton.addEventListener('click', () => {
            previewContainer.style.display = 'none';
        });
        // Mở camera khi nhấn nút
        cameraButton.addEventListener('click', () => {
            try {
                previewContainer.style.display = 'none';
                openCamera();
            } catch (err) {
                alert('Không thể truy cập camera: ' + err.message);
                console.error('Lỗi truy cập camera:', err);
            }
        });
        captureButton.addEventListener('click', () => {
            const canvas = imagePreview;
            const context = canvas.getContext('2d');

            // Đặt kích thước canvas bằng với video
            canvas.width = cameraPreview.videoWidth;
            canvas.height = cameraPreview.videoHeight;

            // Vẽ frame hiện tại từ video vào canvas
            context.drawImage(cameraPreview, 0, 0, canvas.width, canvas.height);

            // Ẩn camera, hiển thị preview
            cameraContainer.style.display = 'none';
            previewContainer.style.display = 'block';
            saveImageButton.style.display = 'block';
            retakeButton.style.display = 'block';
        });

        // Lưu ảnh đã chụp
        saveImageButton.addEventListener('click', () => {
            // Chuyển canvas thành blob
            imagePreview.toBlob(blob => {
                // Tạo file từ blob
                const file = new File([blob], 'camera_capture.jpg', {type: 'image/jpeg'});

                // Tạo DataTransfer để có thể gán file vào input
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                studentImageInput.files = dataTransfer.files;

                // Đóng camera và hide các container
                stopCamera();
                cameraContainer.style.display = 'none';
                saveImageButton.style.display = 'none';
                retakeButton.style.display = 'none';
            }, 'image/jpeg');
        });

        // Chụp lại ảnh
        retakeButton.addEventListener('click', () => {
            previewContainer.style.display = 'none';
            cameraContainer.style.display = 'block';
        });

        // Hủy việc chụp ảnh
        cancelCaptureButton.addEventListener('click', () => {
            stopCamera();
            cameraContainer.style.display = 'none';
        });

        // Dọn dẹp stream khi đóng camera
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        async function openCamera() {
            stream = await navigator.mediaDevices.getUserMedia({video: true});
            cameraPreview.srcObject = stream;
            cameraContainer.style.display = 'block';
        }
    });
</script>
</body>
</html>
