<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Detail</title>
    <link rel="stylesheet" th:href="@{/css/admin/header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
    <link rel="stylesheet" th:href="@{/css/admin/body.css}">
    <link rel="stylesheet" th:href="@{/css/admin/StudentDetail.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="~{/fragments/header :: header}"></div>
<div th:replace="~{/fragments/menu :: menu}"></div>
<!---->
<div class="content-wrapper">
    <div class="container py-4">
        <h2 class="mb-4">Thông Tin Sinh Viên</h2>

        <!-- Thông tin cá nhân -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Thông Tin Cá Nhân</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <form class="col-md-12" id="updateStudentForm">
                        <div class="form-group row">
                            <div class="col-md-9 col-12">
                                <div class="mb-3 row">
                                    <label class="col-sm-3 col-form-label">Mã sinh viên:</label>
                                    <div class="col-sm-9">
                                        <input id="id" type="text" class="form-control" th:value="${student.id}"
                                               readonly>
                                    </div>
                                </div>
                                <div class="mb-3 row">
                                    <label class="col-sm-3 col-form-label">Họ và tên:</label>
                                    <div class="col-sm-9">
                                        <input id="fullName" type="text" class="form-control"
                                               th:value="${student.fullName}">
                                    </div>
                                    <div class="error-message" id="fullNameError">Vui lòng nhập họ tên</div>
                                </div>
                                <div class="mb-3 row">
                                    <label class="col-sm-3 col-form-label">Ngày sinh:</label>
                                    <div class="col-sm-9">
                                        <input type="date" id="dateOfBirth" name="dateOfBirth"
                                               th:value="${student.dateOfBirth}" class="form-control">
                                    </div>
                                    <div class="error-message" id="birthDateError">Vui lòng chọn ngày sinh</div>
                                </div>
                                <div class="mb-3 row">
                                    <label class="col-sm-3 col-form-label">Giới tính:</label>
                                    <div class="col-sm-9">
                                        <select class="form-select" name="gender" id="gender"
                                                th:value="${student.gender}">
                                            <option value="Nam"
                                                    th:selected="${student != null && student.gender == 'Nam'}">
                                                Nam
                                            </option>
                                            <option value="Nữ"
                                                    th:selected="${student != null && student.gender == 'Nữ'}">
                                                Nữ
                                            </option>
                                        </select>
                                    </div>

                                </div>
                                <div class="mb-3 row">
                                    <label class="col-sm-3 col-form-label">Email:</label>
                                    <div class="col-sm-9">
                                        <input id="email" type="email" class="form-control" th:value="${student.email}"
                                               readonly>
                                    </div>
                                </div>
                                <div class="mb-3 row">
                                    <label class="col-sm-3 col-form-label">Số điện thoại:</label>
                                    <div class="col-sm-9">
                                        <input id="phoneNumber" type="tel" class="form-control"
                                               th:value="${student.phoneNumber}">
                                    </div>
                                    <div class="error-message" id="phoneNumberError">Vui lòng nhập số điện thoại hợp lệ
                                        (10 chữ số)
                                    </div>
                                </div>
                                <div class="mb-3 row">
                                    <label class="col-sm-3 col-form-label">Địa chỉ:</label>
                                    <div class="col-sm-9">
                                        <input id="address" type="text" class="form-control"
                                               th:value="${student.address}">
                                    </div>
                                    <div class="error-message" id="addressError">Vui lòng nhập địa chỉ</div>
                                </div>
                                <input type="hidden" id="password" name="password" th:value="${student.password}"
                                       class="form-control">
                            </div>
                            <div class="col-md-3 col-12">
                                <div class="text-center">
                                    <img th:src="@{${student.avatarPath}}"
                                         class="img-fluid avatar-image"
                                         alt="avatar">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <button type="submit">Lưu chỉnh sửa</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div id="popup" class="popup popup-notification" style="display: none;">
        <div class="popup-content">
            <p id="message-popup-notification"></p>
            <button id="closePopupButton">Đóng</button>
        </div>
    </div>
</div>
<!---->
<script th:src="@{/js/menu.js}"></script>
<script th:src="@{/js/header.js}"></script>
<script th:src="@{/js/body.js}"></script>
<script>
    document.getElementById('updateStudentForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const id = document.getElementById('id').value.trim();
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const address = document.getElementById('address').value.trim();
        const gender = document.getElementById('gender').value.trim();
        const dateOfBirth = document.getElementById('dateOfBirth').value.trim();
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        const password = document.getElementById('password').value.trim();
        let isValid = true;

        if (!fullName) {
            document.getElementById('fullNameError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('fullNameError').style.display = 'none';
        }

        if (!address) {
            document.getElementById('addressError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('addressError').style.display = 'none';
        }

        if (!dateOfBirth) {
            document.getElementById('birthDateError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('birthDateError').style.display = 'none';
        }

        if (!phoneNumber || !/^\d{10}$/.test(phoneNumber)) {
            document.getElementById('phoneNumberError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('phoneNumberError').style.display = 'none';
        }

        if (!isValid) {
            return;
        }
        // Tạo đối tượng JSON từ dữ liệu form
        const studentData = {
            id: id,
            fullName: fullName,
            email: email,
            password: password,
            address: address,
            gender: gender,
            dateOfBirth: dateOfBirth,
            phoneNumber: phoneNumber
        };

        fetch('/student/apiEditStudent', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(studentData)
        })
            .then(response => {
                if (response.ok) {
                    showPopupNotification('Thông tin sinh viên đã được lưu!');
                    document.getElementById('studentForm').reset();

                }
            })

    });
</script>
</body>
</html>
