<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Detail</title>
  <link rel="stylesheet" th:href="@{/css/admin/header.css}">
  <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
  <link rel="stylesheet" th:href="@{/css/admin/body.css}">
  <link rel="stylesheet" th:href="@{/css/admin/TeacherDetail.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="~{fragments/admin/header :: header}"></div>
<div th:replace="~{fragments/admin/menu :: menu}"></div>

<div class="content-wrapper">
  <div class="container py-4">
    <h2 class="mb-4">Thông Tin Giáo Viên</h2>

    <div class="card mb-4">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Thông Tin Cá Nhân</h5>
      </div>
      <div class="card-body">
        <div class="row">
          <form class="col-md-12" id="updateTeacherForm">
            <div class="form-group row">
              <div class="col-md-9 col-12">
                <div class="mb-3 row">
                  <label class="col-sm-3 col-form-label">Mã giáo viên:</label>
                  <div class="col-sm-9">
                    <input id="teacherId" type="text" class="form-control" th:value="${teacher.teacherId}" readonly>
                  </div>
                </div>
                <input id="accountId" type="hidden" th:value="${teacher.account.accountId}">
                <input id="username" type="hidden" th:value="${teacher.account.username}">
                <input id="password" type="hidden" th:value="${teacher.account.password}">
                <input id="roleId" type="hidden" th:value="${teacher.account.role.roleId}">

                <div class="mb-3 row">
                  <label class="col-sm-3 col-form-label">Họ và tên:</label>
                  <div class="col-sm-9">
                    <input id="fullName" type="text" class="form-control" th:value="${teacher.account.fullName}">
                  </div>
                </div>

                <div class="mb-3 row">
                  <label class="col-sm-3 col-form-label">Ngày sinh:</label>
                  <div class="col-sm-9">
                    <input type="date" id="dateOfBirth" class="form-control" th:value="${teacher.account.dateOfBirth}">
                  </div>
                </div>

                <div class="mb-3 row">
                  <label class="col-sm-3 col-form-label">Giới tính:</label>
                  <div class="col-sm-9">
                    <select class="form-select" id="gender">
                      <option value="Nam" th:selected="${teacher.account.gender == 'Nam'}">Nam</option>
                      <option value="Nữ" th:selected="${teacher.account.gender == 'Nữ'}">Nữ</option>
                    </select>
                  </div>
                </div>

                <div class="mb-3 row">
                  <label class="col-sm-3 col-form-label">Email:</label>
                  <div class="col-sm-9">
                    <input id="email" type="email" class="form-control" th:value="${teacher.account.email}" readonly>
                  </div>
                </div>

                <div class="mb-3 row">
                  <label class="col-sm-3 col-form-label">Số điện thoại:</label>
                  <div class="col-sm-9">
                    <input id="phoneNumber" type="tel" class="form-control" th:value="${teacher.account.phoneNumber}">
                  </div>
                </div>

                <div class="mb-3 row">
                  <label class="col-sm-3 col-form-label">Địa chỉ:</label>
                  <div class="col-sm-9">
                    <input id="address" type="text" class="form-control" th:value="${teacher.account.address}">
                  </div>
                </div>

                <div class="mb-3 row">
                  <label class="col-sm-3 col-form-label">Chuyên môn:</label>
                  <div class="col-sm-9">
                    <input id="subjectSpecialization" type="text" class="form-control" th:value="${teacher.subjectSpecialization}">
                  </div>
                </div>
              </div>
            </div>

            <div class="form-group text-center">
              <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Lưu chỉnh sửa</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<!---->
<script th:src="@{/js/admin/menu.js}"></script>
<script th:src="@{/js/admin/header.js}"></script>
<script th:src="@{/js/admin/body.js}"></script>
<script>
  document.getElementById('updateTeacherForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const teacherData = {
          teacherId: document.getElementById('teacherId').value.trim(),
          account: {
              accountId: document.getElementById('accountId').value.trim(),
              username: document.getElementById('username').value.trim(),
              password: document.getElementById('password').value.trim(),
              fullName: document.getElementById('fullName').value.trim(),
              email: document.getElementById('email').value.trim(),
              address: document.getElementById('address').value.trim(),
              gender: document.getElementById('gender').value.trim(),
              dateOfBirth: document.getElementById('dateOfBirth').value.trim(),
              phoneNumber: document.getElementById('phoneNumber').value.trim(),
              role: { roleId: document.getElementById('roleId').value.trim() }
          },
          subjectSpecialization: document.getElementById('subjectSpecialization').value.trim()
      };

      fetch('/teacher/apiEditTeacher', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(teacherData)
      })
      .then(response => response.json())
      .then(data => {
          alert('Thông tin giáo viên đã được lưu!');
          location.reload();
      })
      .catch(error => {
          console.error("❌ Lỗi khi cập nhật:", error);
          alert('Cập nhật thất bại!');
      });
  });
</script>
</body>
</html>
