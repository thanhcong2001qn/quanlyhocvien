<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Admin Mới</title>
    <link rel="stylesheet" th:href="@{/css/admin/header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
    <link rel="stylesheet" th:href="@{/css/admin/body.css}">
    <link rel="stylesheet" th:href="@{/css/admin/addAdmin.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="~{/fragments/admin/header :: header}"></div>
<div th:replace="~{/fragments/admin/menu :: menu}"></div>

<div class="content-wrapper">
    <div class="container">
        <div class="form-header">
            <h1>Thêm Admin Mới</h1>
        </div>

        <form id="adminForm" enctype="multipart/form-data">
            <!-- Thông tin cơ bản -->
            <div class="form-section">
                <h2 class="section-title">Thông tin cá nhân</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="required-field" for="fullName">Họ và tên</label>
                        <input type="text" class="form-control" id="fullName" name="admin.account.fullName"
                               placeholder="Nhập họ và tên" required>
                        <div class="error-message" id="fullNameError">Vui lòng nhập họ tên</div>
                    </div>

                    <div class="form-group">
                        <label class="required-field" for="email">Email</label>
                        <input type="email" class="form-control" id="email" name="admin.account.email"
                               placeholder="example@domain.com" required>
                        <div class="error-message" id="emailError">Vui lòng nhập email hợp lệ</div>
                    </div>

                    <div class="form-group">
                        <label for="gender">Giới tính</label>
                        <select class="form-control" name="admin.account.gender" id="gender">
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="required-field" for="dateOfBirth">Ngày sinh</label>
                        <input type="date" class="form-control" id="dateOfBirth"
                               name="admin.account.dateOfBirth" required>
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">Số điện thoại</label>
                        <input type="tel" class="form-control" id="phoneNumber"
                               name="admin.account.phoneNumber" placeholder="0123456789">
                    </div>

                    <div class="form-group">
                        <label for="address">Địa chỉ</label>
                        <input type="text" class="form-control" id="address"
                               name="admin.account.address" placeholder="Nhập địa chỉ">
                    </div>
                </div>
            </div>

            <!-- Thông tin quyền hạn -->
            <div class="form-section">
                <h2 class="section-title">Quyền hạn và vai trò</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="adminRole">Vai trò Admin</label>
                        <select class="form-control" name="admin.adminRole" id="adminRole">
                            <option value="SUPER_ADMIN">Super Admin</option>
                            <option value="COURSE_ADMIN">Course Admin</option>
                            <option value="USER_ADMIN">User Admin</option>
                            <option value="CONTENT_ADMIN">Content Admin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="accessLevel">Cấp độ truy cập</label>
                        <select class="form-control" name="admin.accessLevel" id="accessLevel">
                            <option value="FULL_ACCESS">Full Access</option>
                            <option value="RESTRICTED_ACCESS">Restricted Access</option>
                            <option value="LIMITED_ACCESS">Limited Access</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Hình ảnh -->
            <div class="form-section">
                <h2 class="section-title">Hình ảnh đại diện</h2>
                <div class="form-group">
                    <div class="file-input-wrapper">
                        <label class="file-input-button" for="adminImage">
                            <i class="fas fa-upload"></i> Chọn hình ảnh
                        </label>
                        <input type="file" id="adminImage" name="admin.account.avatar_path"
                               accept="image/*" style="display: none;">
                        <div id="selectedFileName" class="mt-2"></div>
                    </div>
                </div>
            </div>

            <!-- Nút submit -->
            <div class="text-center mt-4">
                <button type="submit" class="submit-button" id="addAdminBtn">
                    <i class="fas fa-user-plus me-2"></i>Thêm Admin
                </button>
            </div>
        </form>
    </div>

    <!-- Popup Notification -->
    <div id="popup" class="popup" style="display: none;">
        <div class="popup-content">
            <p id="message-popup-notification"></p>
            <button class="submit-button" id="closePopupButton">Đóng</button>
        </div>
    </div>
</div>

<script th:src="@{/js/admin/menu.js}"></script>
<script th:src="@{/js/admin/header.js}"></script>
<script>
    // Hiển thị tên file đã chọn
    document.getElementById('adminImage').addEventListener('change', function(e) {
        const fileName = e.target.files[0]?.name || 'Chưa chọn file';
        document.getElementById('selectedFileName').textContent = fileName;
    });

    // Xử lý form submit
    document.getElementById('adminForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Thêm class loading khi đang xử lý
        this.classList.add('loading');

        const adminForm = new FormData(this);

        if (!adminForm.has("username") || !adminForm.get("username")) {
            adminForm.append("username", adminForm.get("admin.account.email"));
        }

        adminForm.append("admin.createdBy", "VoThanhHa28");
        adminForm.append("admin.updatedBy", "VoThanhHa28");

        const fileInput = document.getElementById("adminImage");
        if (fileInput.files.length === 0) {
            adminForm.delete("adminImage");
        }

        fetch('/admin/apiAddAdmin', {
            method: 'POST',
            body: adminForm
        })
        .then(async response => {
            if (response.ok) {
                showNotification("Thêm admin thành công!", "success");
                this.reset();
                document.getElementById('selectedFileName').textContent = '';
            } else {
                const errorMessage = await response.text();
                showNotification(errorMessage, "error");
            }
        })
        .catch(error => {
            showNotification("Không thể kết nối đến máy chủ!", "error");
        })
        .finally(() => {
            this.classList.remove('loading');
        });
    });

    function showNotification(message, type) {
        const popup = document.getElementById('popup');
        const messageElement = document.getElementById('message-popup-notification');

        messageElement.textContent = message;
        popup.style.display = 'block';

        if (type === 'error') {
            popup.classList.add('error');
        } else {
            popup.classList.remove('error');
        }

        // Tự động đóng sau 3 giây
        setTimeout(() => {
            popup.style.display = 'none';
        }, 3000);
    }

    // Đóng popup khi click nút đóng
    document.getElementById('closePopupButton').addEventListener('click', function() {
        document.getElementById('popup').style.display = 'none';
    });
</script>
</body>
</html>
