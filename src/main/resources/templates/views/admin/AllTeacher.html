<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Teachers</title>
  <link rel="stylesheet" th:href="@{/css/admin/header.css}">
  <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
  <link rel="stylesheet" th:href="@{/css/admin/body.css}">
  <link rel="stylesheet" th:href="@{/css/admin/AllTeacher.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div th:replace="~{/fragments/admin/header :: header}"></div>
<div th:replace="~{/fragments/admin/menu :: menu}"></div>
<div th:replace="~{/fragments/common/confirm-popup}"></div>

<!-- Body -->
<div class="content-wrapper">
  <div class="container">
    <!-- Breadcrumb -->
    <div class="breadcrumbs-area">
      <div class="row">
        <div class="col-12 mb-2">
          <h1 class="page-title">Quản Lý Giáo Viên</h1>
        </div>
        <div class="col-12">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
            <li class="breadcrumb-item active">Quản lý giáo viên</li>
          </ol>
        </div>
      </div>
    </div>

    <!-- Search Card -->
    <div class="card search-card">
      <div class="card-body">
        <form th:action="@{/teachers/search}" method="get" class="search-form">
          <div class="row g-3">
            <div class="col-md-5">
              <label class="form-label">Tìm kiếm theo tên</label>
              <input type="text" class="form-control" name="name" th:value="${param.name}"
                     placeholder="Nhập tên giáo viên...">
            </div>
            <div class="col-md-5">
              <label class="form-label">Tìm kiếm theo chuyên môn</label>
              <input type="text" class="form-control" name="subject" th:value="${param.subject}"
                     placeholder="Nhập chuyên môn...">
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-search"></i> Tìm kiếm
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Table Card -->
    <div class="card table-card">
      <div class="card-header">
        <h5 class="card-title">Danh sách giáo viên</h5>
        <div class="card-tools">
          <a th:href="@{/add-teacher}" class="btn btn-success">
            <i class="fas fa-plus"></i> Thêm mới
          </a>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table">
            <thead>
            <tr>
              <th>#ID</th>
              <th>Họ và tên <i class="fas fa-sort sort-icon"></i></th>
              <th>Giới tính <i class="fas fa-sort sort-icon"></i></th>
              <th>Chuyên môn <i class="fas fa-sort sort-icon"></i></th>
              <th>Ngày nhận việc <i class="fas fa-sort sort-icon"></i></th>
              <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="teacher : ${teachers}">
              <td th:text="${teacher.teacherId}"></td>
              <td th:text="${teacher.account != null ? teacher.account.fullName : 'N/A'}"></td>
              <td>
                                    <span class="gender-badge"
                                          th:classappend="${teacher.account != null && teacher.account.gender == 'Nam' ? 'male' : 'female'}"
                                          th:text="${teacher.account != null ? teacher.account.gender : 'N/A'}">
                                    </span>
              </td>
              <td th:text="${teacher.subjectSpecialization}"></td>
              <td th:text="${teacher.hireDate != null ? #temporals.format(teacher.hireDate, 'dd/MM/yyyy') : 'N/A'}"></td>
              <td>
                <div class="action-buttons">
                  <button class="btn btn-icon btn-edit" th:data-id="${teacher.teacherId}">
                    <i class="fas fa-edit"></i>
                  </button>
                  <button class="btn btn-icon btn-delete" th:data-id="${teacher.teacherId}">
                    <i class="fas fa-trash-alt"></i>
                  </button>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(teachers)}">
              <td colspan="6" class="text-center">Không tìm thấy giáo viên nào</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer">
        <nav aria-label="Pagination" th:if="${totalPages > 1}">
          <ul class="pagination justify-content-center m-0">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
              <a class="page-link" th:href="@{${'/teachers'}(page=${currentPage - 1}, size=${pageSize}, sort=${sort})}">&laquo;</a>
            </li>
            <li class="page-item" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${pageNumber == currentPage} ? 'active'">
              <a class="page-link" th:text="${pageNumber}"
                 th:href="@{${'/teachers'}(page=${pageNumber}, size=${pageSize}, sort=${sort})}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
              <a class="page-link" th:href="@{${'/teachers'}(page=${currentPage + 1}, size=${pageSize}, sort=${sort})}">&raquo;</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script th:src="@{/js/admin/menu.js}"></script>
<script th:src="@{/js/admin/header.js}"></script>
<script th:src="@{/js/admin/body.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common/popup.js}"></script>

<!-- Delete and Edit functionality -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
      // Delete teacher
      document.querySelectorAll('.delete-teacher').forEach(button => {
          button.addEventListener('click', function () {
              const teacherId = this.getAttribute('data-id');
              showConfirmPopup('Bạn có chắc muốn xóa giáo viên này?', function () {
                  fetch('/teacher/deleteTeacher/' + teacherId, { method: 'DELETE' })
                      .then(response => response.text())
                      .then(message => {
                          console.log("✅ Xóa thành công:", message);
                          const confirmModal = bootstrap.Modal.getInstance(document.getElementById('confirmPopup'));
                          if (confirmModal) {
                              confirmModal.hide();
                          }
                          setTimeout(() => {
                              location.reload();
                          }, 2000);
                      })
                      .catch(error => {
                          console.error('❌ Lỗi khi xoá giáo viên:', error);
                          alert('Đã xảy ra lỗi khi xoá giáo viên.');
                      });
              });
          });
      });

      // Edit teacher
      document.querySelectorAll('.edit-teacher').forEach(button => {
          button.addEventListener('click', function () {
              const teacherId = this.getAttribute('data-id');
              window.location.href = '/teacherDetail/' + teacherId;
          });
      });
  });
</script>
</body>
</html>
