<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Teachers</title>
  <link rel="stylesheet" th:href="@{/css/admin/header.css}">
  <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
  <link rel="stylesheet" th:href="@{/css/admin/body.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/admin/common.css}">
</head>
<body>

<div th:replace="~{/fragments/admin/header :: header}"></div>
<div th:replace="~{/fragments/admin/menu :: menu}"></div>
<div th:replace="~{/fragments/common/confirm-popup}"></div>

<!-- Body -->
<div class="content-wrapper">
  <div class="container">

    <!-- Breadcrumb -->
    <div class="breadcrumbs-area">
      <div class="row">
        <div class="col-12 mb-2">
          <h1 class="page-title">Quản Lý Giáo Viên</h1>
        </div>
        <div class="col-12">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
            <li class="breadcrumb-item active">Quản lý giáo viên</li>
          </ol>
        </div>
      </div>
    </div>

    <!-- Search Card -->
    <div class="card search-card">
      <div class="card-body">
        <form th:action="@{/teacher/search}" method="get" id="searchForm" class="search-form">
          <div class="row g-3 align-items-end">
            <div class="col-md-5">
              <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="form-control" name="name" id="searchName" th:value="${param.name}"
                       placeholder="Nhập tên giáo viên...">
              </div>
            </div>
            <div class="col-md-5">
              <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="form-control" name="subject" id="searchSubject" th:value="${param.subject}"
                       placeholder="Nhập chuyên môn...">
              </div>
            </div>
            <div class="col-md-2 d-flex">
              <button type="button" class="btn clear-search w-100 d-flex align-items-center justify-content-center gap-2">
                <i class="fas fa-times"></i>
                Xóa bộ lọc
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Table Card -->
    <div class="card table-card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title">Danh sách giáo viên</h5>
        <div class="card-tools">
          <a th:href="@{/add-teacher}" class="btn btn-success">
            <i class="fas fa-plus"></i> Thêm mới
          </a>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table">
            <thead>
            <tr>
              <th>#ID</th>
              <th>Họ và tên <i class="fas fa-sort sort-icon"></i></th>
              <th>Giới tính <i class="fas fa-sort sort-icon"></i></th>
              <th>Chuyên môn <i class="fas fa-sort sort-icon"></i></th>
              <th>Ngày nhận việc <i class="fas fa-sort sort-icon"></i></th>
              <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <!-- JavaScript fetch render Teachers ở đây -->
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer">
        <nav aria-label="Pagination">
          <ul id="pagination" class="pagination justify-content-center m-0">
            <!-- JavaScript tự động render phân trang -->
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
<!-- Scripts -->
<script th:src="@{/js/admin/searching/teachers-search.js}"></script>
<script th:src="@{/js/admin/list/teacher-list.js}"></script>

<div id="loadingSpinner">
  <i class="fas fa-spinner fa-spin"></i>
</div>
<div th:replace="fragments/common/footer.html :: footer-scripts"></div>
</body>
</html>
