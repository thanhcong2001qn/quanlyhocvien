<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layouts/main-layout}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Giáo Viên</title>
  <link rel="stylesheet" th:href="@{/css/admin/AllTeacher.css}">
<body>

<section layout:fragment="content">
  <div class="content-wrapper">
    <div class="container-fluid">
      <!-- Header Section -->
      <div class="content-header">
        <div class="breadcrumbs-area mb-2">
          <div class="row flex-column">
            <div class="col-12 mb-2">
              <h1 class="m-0 page-title">
                <i class="fas fa-chalkboard-teacher me-2"></i>
                Quản Lý Giáo Viên
              </h1>
            </div>
            <div class="col-12">
              <ol class="breadcrumb">
                <li class="breadcrumb-item">
                  <a th:href="@{/admin}">
                    <i class="fas fa-home me-1"></i>
                    Trang chủ
                  </a>
                </li>
                <li class="breadcrumb-item active">
                  <i class="fas fa-chalkboard-teacher me-1"></i>
                  Quản lý giáo viên
                </li>
              </ol>
            </div>
          </div>
        </div>
      </div>

      <!-- Search & Filter Section -->
      <div class="card search-card mb-4">
        <div class="card-body">
          <form th:action="@{/teacher/search}" method="get" id="searchForm" class="row g-3">
            <div class="col-md-5">
              <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="form-control" name="name" id="searchName" th:value="${param.name}"
                       placeholder="Nhập tên giáo viên...">
              </div>
            </div>
            <div class="col-md-5">
              <div class="search-box">
                <i class="fas fa-book-open search-icon"></i>
                <input type="text" class="form-control" name="subject" id="searchSubject" th:value="${param.subject}"
                       placeholder="Nhập chuyên môn...">
              </div>
            </div>
            <div class="col-md-2 d-flex">
              <button type="button" class="btn btn-reset w-100">
                <i class="fas fa-times me-2"></i>
                Xóa bộ lọc
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Table Card -->
      <div class="card table-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="card-title">
            <i class="fas fa-list me-2"></i>
            Danh sách giáo viên
          </h3>
          <div class="card-tools">
            <a th:href="@{/add-teacher}" class="btn btn-success btn-sm">
              <i class="fas fa-plus"></i> Thêm mới
            </a>
          </div>
        </div>
        <div class="card-body table-responsive">
          <table class="table table-hover">
            <thead>
            <tr>
              <th><i class="fas fa-hashtag me-1"></i> #ID</th>
              <th><i class="fas fa-id-card me-1"></i> Họ và tên</th>
              <th><i class="fas fa-venus-mars me-1"></i> Giới tính</th>
              <th><i class="fas fa-book-open me-1"></i> Chuyên môn</th>
              <th><i class="fas fa-calendar me-1"></i> Ngày nhận việc</th>
              <th><i class="fas fa-cog me-1"></i> Hành động</th>
            </tr>
            </thead>
            <tbody>
            <!-- JavaScript fetch render Teachers ở đây -->
            </tbody>
          </table>
        </div>
        <div class="card-footer">
          <nav aria-label="Pagination">
            <ul id="pagination" class="pagination justify-content-center m-0">
              <!-- JavaScript tự động render phân trang -->
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div id="loadingSpinner" class="loading-overlay">
    <div class="spinner-wrapper">
      <i class="fas fa-spinner fa-spin"></i>
    </div>
  </div>
</section>
<!-- Scripts -->
<script th:src="@{/js/admin/searching/teachers-search.js}"></script>
<script th:src="@{/js/admin/list/teacher-list.js}"></script>
<div th:replace="fragments/common/footer.html :: footer-scripts"></div>
</body>
</html>
