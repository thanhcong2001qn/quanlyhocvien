<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layouts/main-layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Admin</title>
    <th:block layout:fragment="style">
        <link rel="stylesheet" th:href="@{/css/admin/AllAdmin.css}">
    </th:block>
</head>
<body>
<section layout:fragment="content">
    <div class="content-wrapper">
        <div class="container">
            <!-- Header Section -->
            <div class="content-header">
                <div class="container-fluid">
                    <div class="breadcrumbs-area mb-2">
                        <div class="row flex-column">
                            <div class="col-12 mb-2">
                                <h1 class="m-0 page-title">
                                    <i class="fas fa-user-shield me-2"></i>
                                    Quản Lý Admin
                                </h1>
                            </div>
                            <div class="col-12">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item">
                                        <a th:href="@{/admin}">
                                            <i class="fas fa-home me-1"></i>
                                            Trang chủ
                                        </a>
                                    </li>
                                    <li class="breadcrumb-item active">
                                        <i class="fas fa-user-shield me-1"></i>
                                        Quản lý admin
                                    </li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="content">
                <div class="container-fluid">
                    <!-- Search & Filter Section -->
                    <div class="card search-card mb-4">
                        <div class="card-body">
                            <form id="searchForm" th:action="@{/admin/search}" method="GET" class="row g-3">
                                <div class="col-md-5">
                                    <div class="search-box">
                                        <i class="fas fa-search search-icon"></i>
                                        <input type="text" class="form-control" name="name"
                                               th:value="${param.name}" placeholder="Tìm kiếm theo tên admin...">
                                    </div>
                                </div>
                                <div class="col-md-5">
                                    <div class="search-box">
                                        <i class="fas fa-user-tag search-icon"></i>
                                        <select class="form-select" name="role" th:value="${param.role}">
                                            <option value="">Tất cả vai trò</option>
                                            <option value="1">Admin</option>
                                            <option value="2">Giáo viên</option>
                                            <option value="3">Học viên</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-2 d-flex">
                                    <button type="button" class="btn btn-reset w-100 clear-search">
                                        <i class="fas fa-times me-2"></i>
                                        Xóa bộ lọc
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Table Card -->
                    <div class="card table-card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h3 class="card-title">
                                <i class="fas fa-list me-2"></i>
                                Danh sách Admin
                            </h3>
                            <div class="card-tools">
                                <a th:href="@{/add-admin}" class="btn btn-success btn-sm">
                                    <i class="fas fa-plus"></i> Thêm mới
                                </a>
                            </div>
                        </div>
                        <div class="card-body table-responsive p-0">
                            <table id="adminTable" class="table table-hover">
                                <thead>
                                <tr>
                                    <th><i class="fas fa-hashtag me-1"></i> #ID</th>
                                    <th><i class="fas fa-id-card me-1"></i> Họ và tên</th>
                                    <th><i class="fas fa-envelope me-1"></i> Email</th>
                                    <th><i class="fas fa-user-tag me-1"></i> Vai trò</th>
                                    <th><i class="fas fa-calendar me-1"></i> Ngày tạo</th>
                                    <th><i class="fas fa-cog me-1"></i> Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <!-- JavaScript sẽ render danh sách admin -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <div class="card-footer">
                            <nav aria-label="Page navigation">
                                <ul id="pagination" class="pagination justify-content-center m-0">
                                    <!-- JavaScript sẽ render phân trang -->
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-overlay">
        <div class="spinner-wrapper">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
    </div>
</section>
<th:block layout:fragment="script">
    <script th:src="@{/js/admin/searching/admins-search.js}" defer></script>
    <script th:src="@{/js/admin/list/admins-list.js}" defer></script>
</th:block>
</body>
</html>
