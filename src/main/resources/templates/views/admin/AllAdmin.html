<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin/header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
    <link rel="stylesheet" th:href="@{/css/admin/body.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
</head>
<body>

<div th:replace="~{/fragments/admin/header :: header}"></div>
<div th:replace="~{/fragments/admin/menu :: menu}"></div>
<div th:replace="~{/fragments/common/confirm-popup :: confirm-popup}"></div>

<div class="content-wrapper">
    <div class="container">

        <!-- Header Section -->
        <div class="content-header">
            <div class="container-fluid">
                <div class="breadcrumbs-area mb-2">
                    <div class="row flex-column">
                        <div class="col-12 mb-2">
                            <h1 class="m-0 page-title">Quản Lý Admin</h1>
                        </div>
                        <div class="col-12">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
                                <li class="breadcrumb-item active">Quản lý admin</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Card -->
        <div class="content">
            <div class="container-fluid">
                <div class="card search-card mb-4">
                    <div class="card-body">
                        <form id="searchForm" th:action="@{/admin/search}" method="GET" class="row g-3">
                            <div class="col-md-5">
                                <div class="search-box">
                                    <i class="fas fa-search search-icon"></i>
                                    <input type="text" class="form-control" name="name"
                                           th:value="${param.name}" placeholder="Tìm kiếm theo tên admin...">
                                </div>
                            </div>
                            <div class="col-md-5">
                                <div class="search-box">
                                    <i class="fas fa-search search-icon"></i>
                                    <input type="text" class="form-control" name="role"
                                           th:value="${param.role}" placeholder="Tìm kiếm theo vai trò...">
                                </div>
                            </div>
                            <div class="col-md-2 d-flex">
                                <button type="button" class="btn clear-search w-100 d-flex align-items-center justify-content-center gap-2">
                                    <i class="fas fa-times"></i>
                                    Xóa bộ lọc
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="card table-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="card-title">Danh sách Admin</h3>
                        <div class="card-tools">
                            <a th:href="@{/add-admin}" class="btn btn-success btn-sm">
                                <i class="fas fa-plus"></i> Thêm mới
                            </a>
                        </div>
                    </div>
                    <div class="card-body table-responsive p-0">
                        <table id="adminTable" class="table table-hover">
                            <thead>
                            <tr>
                                <th>#ID</th>
                                <th>Họ và tên</th>
                                <th>Email</th>
                                <th>Vai trò</th>
                                <th>Ngày tạo</th>
                                <th>Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- JavaScript sẽ render danh sách admin -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="card-footer">
                        <nav aria-label="Page navigation">
                            <ul id="pagination" class="pagination justify-content-center m-0">
                                <!-- JavaScript sẽ render phân trang -->
                            </ul>
                        </nav>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
<!--Script chung-->
<div th:replace="fragments/common/footer.html :: footer-scripts"></div>

<!--Js-->
<script th:src="@{/js/admin/searching/admins-search.js}"></script>
<script th:src="@{/js/admin/list/admins-list.js}"></script>

<div id="loadingSpinner">
    <i class="fas fa-spinner fa-spin"></i>
</div>
</body>
</html>
