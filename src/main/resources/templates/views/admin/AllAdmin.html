<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Admins</title>
    <link rel="stylesheet" th:href="@{/css/admin/header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
    <link rel="stylesheet" th:href="@{/css/admin/body.css}">
    <link rel="stylesheet" th:href="@{/css/admin/AllAdmin.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div th:replace="~{/fragments/admin/header :: header}"></div>
<div th:replace="~{/fragments/admin/menu :: menu}"></div>
<div th:replace="~{/fragments/common/confirm-popup}"></div>

<!-- Body -->
<div class="content-wrapper">
    <div class="container">
        <!-- Breadcrumb -->
        <div class="breadcrumbs-area">
            <div class="row">
                <div class="col-12 mb-2">
                    <h1 class="page-title">Quản Lý Admin</h1>
                </div>
                <div class="col-12">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
                        <li class="breadcrumb-item active">Quản lý admin</li>
                    </ol>
                </div>
            </div>
        </div>

        <!-- Search Card -->
        <div class="card search-card">
            <div class="card-body">
                <form th:action="@{/admins/search}" method="get" class="search-form">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label">Tìm kiếm theo tên</label>
                            <input type="text" class="form-control" name="name"
                                   th:value="${param.name}" placeholder="Nhập tên admin...">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Tìm kiếm theo vai trò</label>
                            <input type="text" class="form-control" name="role"
                                   th:value="${param.role}" placeholder="Nhập vai trò...">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-search"></i> Tìm kiếm
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Table Card -->
        <div class="card table-card">
            <div class="card-header">
                <h5 class="card-title">Danh sách admin</h5>
                <div class="card-tools">
                    <a th:href="@{/add-admin}" class="btn btn-success">
                        <i class="fas fa-plus"></i> Thêm mới
                    </a>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Họ và tên <i class="fas fa-sort sort-icon"></i></th>
                            <th>Email <i class="fas fa-sort sort-icon"></i></th>
                            <th>Vai trò <i class="fas fa-sort sort-icon"></i></th>
                            <th>Ngày tạo <i class="fas fa-sort sort-icon"></i></th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="admin : ${admins}">
                            <td th:text="${admin.adminId}"></td>
                            <td th:text="${admin.account?.fullName ?: 'N/A'}"></td>
                            <td th:text="${admin.account?.email ?: 'N/A'}"></td>
                            <td>
                                    <span class="role-badge"
                                          th:text="${admin.account?.role?.roleName ?: 'N/A'}">
                                    </span>
                            </td>
                            <td th:text="${admin.account?.createdAt != null ?
                                              #temporals.format(admin.account.createdAt, 'dd/MM/yyyy') : 'N/A'}">
                            </td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn btn-icon btn-edit"
                                            th:data-id="${admin.adminId}">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-icon btn-delete"
                                            th:data-id="${admin.adminId}">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(admins)}">
                            <td colspan="6" class="text-center">Không tìm thấy admin nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <nav aria-label="Pagination" th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center m-0">
                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                            <a class="page-link" th:href="@{${'/admins'}(page=${currentPage - 1}, size=${pageSize}, sort=${sort})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                            th:classappend="${pageNumber == currentPage} ? 'active'">
                            <a class="page-link" th:text="${pageNumber}"
                               th:href="@{${'/admins'}(page=${pageNumber}, size=${pageSize}, sort=${sort})}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{${'/admins'}(page=${currentPage + 1}, size=${pageSize}, sort=${sort})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Delete admin
        document.querySelectorAll('.delete-admin').forEach(button => {
            button.addEventListener('click', function () {
                const adminId = this.getAttribute('data-id');
                showConfirmPopup('Bạn có chắc muốn xóa admin này?', function () {
                    fetch('/admin/deleteAdmin/' + adminId, { method: 'DELETE' })
                        .then(response => response.text())
                        .then(message => {
                            console.log("✅ Xóa thành công:", message);
                            const confirmModal = bootstrap.Modal.getInstance(document.getElementById('confirmPopup'));
                            if (confirmModal) {
                                confirmModal.hide();
                            }
                            setTimeout(() => {
                                location.reload();
                            }, 2000);
                        })
                        .catch(error => {
                            console.error('❌ Lỗi khi xoá admin:', error);
                            alert('Đã xảy ra lỗi khi xoá admin.');
                        });
                });
            });
        });

        // Edit admin
        document.querySelectorAll('.edit-admin').forEach(button => {
            button.addEventListener('click', function () {
                const adminId = this.getAttribute('data-id');
                window.location.href = '/adminDetail/' + adminId;
            });
        });
    });
</script>
<script th:src="@{/js/admin/menu.js}"></script>
<script th:src="@{/js/admin/header.js}"></script>
<script th:src="@{/js/admin/body.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common/popup.js}"></script>
</body>
</html>
