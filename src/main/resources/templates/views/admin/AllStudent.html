<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin/header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
    <link rel="stylesheet" th:href="@{/css/admin/body.css}">
    <link rel="stylesheet" th:href="@{/css/admin/AllStudent.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:replace="~{/fragments/header :: header}"></div>
<div th:replace="~{/fragments/menu :: menu}"></div>

<!--body-->
<div class="content-wrapper">
    <!-- Page header with title -->
    <div class="content-header">
        <div class="container-fluid">
            <div class="breadcrumbs-area mb-2">
                <div class="col-sm-6">
                    <h1 class="m-0 page-title">Quản Lý Sinh Viên</h1>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
                        <li class="breadcrumb-item active">Quản lý sinh viên</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <div class="content">
        <div class="container-fluid">
            <!-- Khu vực Tìm kiếm -->
            <div class="card mb-4">
                <div class="card-header">
                    <h3 class="card-title">Tìm kiếm sinh viên</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/students/search}" method="get" class="row g-3">
                        <div class="col-md-5">
                            <label for="nameSearch" class="form-label">Tìm kiếm theo tên</label>
                            <input type="text" class="form-control" id="nameSearch" name="name" th:value="${param.name}" placeholder="Nhập tên sinh viên...">
                        </div>

                        <div class="col-md-5">
                            <label for="classSearch" class="form-label">Tìm kiếm theo lớp</label>
                            <input type="text" class="form-control" id="classSearch" name="class" th:value="${param.class}" placeholder="Nhập tên lớp...">
                        </div>

                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-search"></i> Tìm kiếm
                            </button>
                        </div>
                    </form>
                </div>


            <!-- Khu vực Bảng Sinh viên -->
                <div class="card-header card-header2">
                    <h3 class="card-title">Danh sách sinh viên</h3>
                    <div class="card-tools">
                        <a th:href="@{/add-student}" class="btn btn-sm btn-success">
                            <i class="fas fa-plus"></i> Thêm mới
                        </a>
                    </div>
                </div>
                <div class="card-body table-responsive p-0">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th scope="col" th:data-sort="id">
                                    #ID
                                </th>
                                <th scope="col" th:data-sort="name">
                                    Họ và tên
                                    <span class="sort-icon">
                                        <i class="fas fa-sort"></i>
                                    </span>
                                </th>
                                <th scope="col" th:data-sort="gender">
                                    Giới tính
                                    <span class="sort-icon">
                                        <i class="fas fa-sort"></i>
                                    </span>
                                </th>
                                <th scope="col" th:data-sort="class">
                                    Lớp
                                    <span class="sort-icon">
                                        <i class="fas fa-sort"></i>
                                    </span>
                                </th>
                                <th scope="col" th:data-sort="birthDate">
                                    Ngày sinh
                                    <span class="sort-icon">
                                        <i class="fas fa-sort"></i>
                                    </span>
                                </th>
<!--                                <th scope="col" th:data-sort="address">-->
<!--                                    Địa chỉ-->
<!--                                    <span class="sort-icon">-->
<!--                                        <i class="fas fa-sort"></i>-->
<!--                                    </span>-->
<!--                                </th>-->
<!--                                <th scope="col" th:data-sort="phone">-->
<!--                                    Số điện thoại-->
<!--                                    <span class="sort-icon">-->
<!--                                        <i class="fas fa-sort"></i>-->
<!--                                    </span>-->
<!--                                </th>-->
                            </tr>
                        </thead>
                        <tbody>
                        <tr th:each="student : ${students}">
                            <td th:text="${student.id}"></td>
                            <td th:text="${student.fullName}"></td>
                            <td th:text="${student.gender}"></td>
                            <td th:text="fafawfa"></td>
                            <td th:text="${#temporals.format(student.dateOfBirth, 'dd/MM/yyyy')}"></td>
                            <td th:text="${student.address}"></td>
                            <td th:text="${student.phoneNumber}"></td>
                            <td>
                                <div class="btn-group btn-group-sm" role="group">
<!--                                    <a th:href="@{/studentDetail}" class="btn btn-info">-->
<!--                                        <i class="fas fa-eye"></i>-->
<!--                                    </a>-->
                                    <button class="btn btn-info edit-student" th:data-id="${student.id}">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-danger delete-student" th:data-id="${student.id}">
                                        <i class="fas fa-trash"></i>
                                    </button>

                                </div>
                            </td>
                        </tr>
                        <!-- Thông báo nếu không có sinh viên -->
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="7" class="text-center">Không tìm thấy sinh viên nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer">
                    <!-- Phân trang -->
                    <nav aria-label="Pagination" th:if="${totalPages > 1}">
                        <ul class="pagination justify-content-center m-0">
                            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                                <a class="page-link" th:href="@{${'/students'}(page=${currentPage - 1}, size=${pageSize}, sort=${sort})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>
                            <li class="page-item" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                                th:classappend="${pageNumber == currentPage} ? 'active'">
                                <a class="page-link" th:text="${pageNumber}" th:href="@{${'/students'}(page=${pageNumber}, size=${pageSize}, sort=${sort})}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{${'/students'}(page=${currentPage + 1}, size=${pageSize}, sort=${sort})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>


<!--body-->
 Bootstrap JS and dependencies
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Xử lý sắp xếp cho các cột -->
<script>
    async function fetchStudents() {
        try {
            const response = await fetch('/students'); // URL tương ứng với API của bạn
            if (!response.ok) throw new Error('Network response was not ok');

            const students = await response.json(); // Gán dữ liệu trả về cho biến

            //console.log(students); // In ra để kiểm tra

            // Ví dụ thêm xử lý dữ liệu ở đây, như render ra giao diện...
            // renderStudents(students);
        } catch (error) {
            console.error('Có lỗi khi lấy dữ liệu:', error);
        }
    }
    document.addEventListener('DOMContentLoaded', function() {
        // Lắng nghe sự kiện click trên các nút xoá
        document.querySelectorAll('.delete-student').forEach(button => {
            button.addEventListener('click', function() {
                const studentId = this.getAttribute('data-id');

                // Hiển thị hộp thoại xác nhận
                if (confirm('Bạn có chắc muốn xóa sinh viên này?')) {
                    // Gửi yêu cầu xoá đến server bằng fetch API
                    fetch('/student/deleteStudent/' + studentId, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            // Thêm CSRF token nếu bạn sử dụng Spring Security
                            // 'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]').getAttribute('content')
                        }
                    })
                        .then(response => {
                            if (response.ok) {
                                // Xoá hàng trong bảng nếu thành công
                                const row = this.closest('tr');
                                row.parentNode.removeChild(row);
                                alert('Xoá sinh viên thành công!');
                            } else {
                                alert('Đã xảy ra lỗi khi xoá sinh viên.');
                            }
                        })
                        .catch(error => {
                            console.error('Lỗi:', error);
                            alert('Đã xảy ra lỗi khi xoá sinh viên.');
                        });
                }
            });

        });
        document.querySelectorAll('.edit-student').forEach(button => {
            button.addEventListener('click', function() {
                const studentId = this.getAttribute('data-id');
                window.location.href = '/studentDetail/' + studentId;
            });
        });
    });



</script>

<!--body-->

<script th:src="@{js/menu.js}"></script>
<script th:src="@{js/header.js}"></script>
</body>
</html>
