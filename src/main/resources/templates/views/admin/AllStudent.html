<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layouts/main-layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students</title>
    <link rel="stylesheet" th:href="@{/css/admin/AllStudent.css}">
</head>
<body>
<section layout:fragment="content">
    <div class="content-wrapper">
        <div class="container">
            <!-- Breadcrumbs -->
            <div class="content-header">
                <div class="breadcrumbs-area">
                    <div class="mb-2">
                        <h1 class="m-0 page-title">
                            <i class="fas fa-user-graduate me-2"></i>
                            Quản Lý Sinh Viên
                        </h1>
                    </div>
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a th:href="@{/admin}">
                                <i class="fas fa-home me-1"></i>
                                Trang chủ
                            </a>
                        </li>
                        <li class="breadcrumb-item active">
                            <i class="fas fa-user-graduate me-1"></i>
                            Quản lý sinh viên
                        </li>
                    </ol>
                </div>
            </div>

            <!-- Search Section -->
            <div class="card search-card mb-4">
                <div class="card-body">
                    <form class="row g-3 search-form" th:action="@{/student/search}" method="get">
                        <div class="col-md-5">
                            <div class="search-box">
                                <i class="fas fa-search search-icon"></i>
                                <input type="text" name="name" class="form-control" th:value="${param.name}" placeholder="Nhập tên sinh viên...">
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="search-box">
                                <i class="fas fa-search search-icon"></i>
                                <input type="text" name="className" class="form-control" th:value="${param.class}" placeholder="Nhập tên lớp...">
                            </div>
                        </div>
                        <div class="col-md-2 d-flex">
                            <button type="button" class="btn btn-reset w-100 clear-search">
                                <i class="fas fa-times me-2"></i>
                                Xóa bộ lọc
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table Section -->
            <div class="card table-card">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="card-title">
                            <i class="fas fa-list me-2"></i>
                            Danh sách sinh viên
                        </h3>
<!--                        <div class="card-tools">-->
<!--                            <a th:href="@{/add-student}" class="btn btn-success">-->
<!--                                <i class="fas fa-plus"></i> Thêm mới-->
<!--                            </a>-->
<!--                        </div>-->
                    </div>
                </div>
                <div class="card-body table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Họ và tên</th>
                            <th>Giới tính</th>
                            <th>Lớp</th>
                            <th>Ngày sinh</th>
                            <th>Địa chỉ</th>
                            <th>Số điện thoại</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="student : ${students}">
                            <td th:text="${student.studentId}"></td>
                            <td th:text="${student.fullName}"></td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${student.gender == 'Nam' ? 'status-active' : 'status-inactive'}"
                                      th:text="${student.gender}">
                                </span>
                            </td>
                            <td th:text="${student.className}"></td>
                            <td th:text="${#temporals.format(student.dateOfBirth, 'dd/MM/yyyy')}"></td>
                            <td th:text="${student.address}"></td>
                            <td th:text="${student.phoneNumber}"></td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn btn-icon btn-edit" th:data-id="${student.studentId}">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-icon btn-delete" th:data-id="${student.studentId}">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="8" class="text-center">Không tìm thấy sinh viên nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer">
                    <nav aria-label="Page navigation">
                        <ul id="pagination" class="pagination justify-content-center m-0">
                            <!-- JS sẽ render -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-overlay">
        <div class="spinner-wrapper">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
    </div>
</section>
<th:block layout:fragment="script">
    <script th:src="@{/js/admin/searching/students-search.js}" defer></script>
    <script th:src="@{/js/admin/list/student-list.js}" defer></script>
    <!-- Delete and Edit functionality -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Delete student
            document.querySelectorAll('.btn-delete').forEach(button => {
                button.addEventListener('click', function () {
                    const studentId = this.getAttribute('data-id');
                    showConfirmPopup('Bạn có chắc muốn xóa sinh viên này?', function () {
                        fetch('/student/deleteStudent/' + studentId, { method: 'DELETE' })
                            .then(response => response.text())
                            .then(message => {
                                console.log("✅ Xóa thành công:", message);
                                const confirmModal = bootstrap.Modal.getInstance(document.getElementById('confirmPopup'));
                                if (confirmModal) {
                                    confirmModal.hide();
                                }
                                setTimeout(() => {
                                    location.reload();
                                }, 2000);
                            })
                            .catch(error => {
                                console.error('❌ Lỗi khi xoá sinh viên:', error);
                                alert('Đã xảy ra lỗi khi xoá sinh viên.');
                            });
                    });
                });
            });

            // Edit student
            document.querySelectorAll('.btn-edit').forEach(button => {
                button.addEventListener('click', function () {
                    const studentId = this.getAttribute('data-id');
                    window.location.href = '/studentDetail/' + studentId;
                });
            });
        });
    </script>
</th:block>
</body>
</html>
