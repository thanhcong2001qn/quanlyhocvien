<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students</title>
    <link rel="stylesheet" th:href="@{/css/admin/header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
    <link rel="stylesheet" th:href="@{/css/admin/body.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
</head>
<body>

<div th:replace="~{fragments/admin/header :: header}"></div>
<div th:replace="~{fragments/admin/menu :: menu}"></div>
<div th:replace="~{fragments/common/confirm-popup}"></div>

<!-- Body -->
<div class="content-wrapper">
    <div class="container">
        <!-- Breadcrumb -->
        <div class="breadcrumbs-area">
            <div class="row">
                <div class="col-12 mb-2">
                    <h1 class="page-title">Quản Lý Sinh Viên</h1>
                </div>
                <div class="col-12">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang chủ</a></li>
                        <li class="breadcrumb-item active">Quản lý sinh viên</li>
                    </ol>
                </div>
            </div>
        </div>

        <!-- Search Card -->
        <div class="card search-card">
            <div class="card-body">
                <form th:action="@{/student/search}" method="get" class="search-form">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <div class="search-box">
                                <i class="fas fa-search search-icon"></i>
                                <input type="text" class="form-control" name="name" th:value="${param.name}"
                                       placeholder="Nhập tên sinh viên...">
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="search-box">
                                <i class="fas fa-search search-icon"></i>
                                <input type="text" class="form-control" name="className" th:value="${param.class}"
                                       placeholder="Nhập tên lớp...">
                            </div>
                        </div>
                        <div class="col-md-2 d-flex">
                            <button type="button" class="btn clear-search w-100 d-flex align-items-center justify-content-center gap-2">
                                <i class="fas fa-times"></i>
                                Xóa bộ lọc
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Table Card -->
        <div class="card table-card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title">Danh sách sinh viên</h5>
                <div class="card-tools">
                    <a th:href="@{/add-student}" class="btn btn-success">
                        <i class="fas fa-plus"></i> Thêm mới
                    </a>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Họ và tên <i class="fas fa-sort sort-icon"></i></th>
                            <th>Giới tính <i class="fas fa-sort sort-icon"></i></th>
                            <th>Lớp <i class="fas fa-sort sort-icon"></i></th>
                            <th>Ngày sinh <i class="fas fa-sort sort-icon"></i></th>
                            <th>Địa chỉ</th>
                            <th>Số điện thoại</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="student : ${students}">
                            <td th:text="${student.id}"></td>
                            <td th:text="${student.fullName}"></td>
                            <td>
                                <span class="gender-badge"
                                      th:classappend="${student.gender == 'Nam' ? 'male' : 'female'}"
                                      th:text="${student.gender}">
                                </span>
                            </td>
                            <td th:text="${student.class}"></td>
                            <td th:text="${#temporals.format(student.dateOfBirth, 'dd/MM/yyyy')}"></td>
                            <td th:text="${student.address}"></td>
                            <td th:text="${student.phoneNumber}"></td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn btn-icon btn-edit" th:data-id="${student.id}">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-icon btn-delete" th:data-id="${student.id}">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="8" class="text-center">Không tìm thấy sinh viên nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <nav aria-label="Page navigation">
                    <ul id="pagination" class="pagination justify-content-center m-0">
                        <!-- JavaScript sẽ render phân trang -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- Delete and Edit functionality -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Delete student
        document.querySelectorAll('.btn-delete').forEach(button => {
            button.addEventListener('click', function () {
                const studentId = this.getAttribute('data-id');
                showConfirmPopup('Bạn có chắc muốn xóa sinh viên này?', function () {
                    fetch('/student/deleteStudent/' + studentId, { method: 'DELETE' })
                        .then(response => response.text())
                        .then(message => {
                            console.log("✅ Xóa thành công:", message);
                            const confirmModal = bootstrap.Modal.getInstance(document.getElementById('confirmPopup'));
                            if (confirmModal) {
                                confirmModal.hide();
                            }
                            setTimeout(() => {
                                location.reload();
                            }, 2000);
                        })
                        .catch(error => {
                            console.error('❌ Lỗi khi xoá sinh viên:', error);
                            alert('Đã xảy ra lỗi khi xoá sinh viên.');
                        });
                });
            });
        });

        // Edit student
        document.querySelectorAll('.btn-edit').forEach(button => {
            button.addEventListener('click', function () {
                const studentId = this.getAttribute('data-id');
                window.location.href = '/studentDetail/' + studentId;
            });
        });
    });
</script>
<!--Js-->
<!-- Scripts -->
<script th:src="@{/js/admin/searching/students-search.js}"></script>
<script th:src="@{/js/admin/list/student-list.js}"></script>

<div id="loadingSpinner">
    <i class="fas fa-spinner fa-spin"></i>
</div>
<div th:replace="fragments/common/footer.html :: footer-scripts"></div>
</body>
</html>
