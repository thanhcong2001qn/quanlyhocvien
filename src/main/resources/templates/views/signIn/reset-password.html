<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/auth/login.css}">
    <link rel="stylesheet" th:href="@{/css/auth/reset-password.css}">
</head>
<body>
<!-- Notification Container -->
<div th:if="${status == 'success'}">
    <div class="notification-container" id="notificationContainer">
        <div class="notification success" id="successNotification">
            <div class="notification-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="notification-content">
                <h4>Success!</h4>
                <p>Login successfully.</p>
            </div>
            <button class="notification-close" onclick="closeNotification()">
                <i class="fas fa-times"></i>
            </button>
            <div class="notification-progress"></div>
        </div>
    </div>

    <div class="container-fluid p-0 auth-container">
        <div class="row g-0">
            <!-- Image Section -->
            <div class="col-lg-7 d-none d-lg-block">
                <div class="image-container">
                    <div class="overlay"></div>
                    <div class="image-text">
                        <h1>Reset Password</h1>
                        <p>Create a new secure password for your account</p>
                    </div>
                </div>
            </div>

            <!-- Form Section -->
            <div class="col-12 col-lg-5">
                <div class="auth-form-container">
                    <div class="auth-header">
                        <h2>Reset Password</h2>
                        <p>Please enter your new password</p>
                    </div>
                    <form id="resetPasswordForm">
                        <div class="form-group">
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="New password" required>
                                <label for="password">New password</label>
                                <button type="button" class="password-toggle"
                                        onclick="togglePasswordVisibility('password')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="password-strength mb-3">
                            <div class="strength-bar">
                                <div class="progress">
                                    <div class="progress-bar" id="strength-progress" role="progressbar" style="width: 0%"></div>
                                </div>
                            </div>
                            <small id="password-feedback">Password strength</small>
                        </div>
                        <div class="form-group">
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                       placeholder="Confirm password" required>
                                <label for="confirmPassword">Confirm password</label>
                                <button type="button" class="password-toggle"
                                        onclick="togglePasswordVisibility('confirmPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-4" id="submitBtn">Reset Password
                        </button>

                        <div class="mt-4 text-center">
                            <a href="/login" class="back-link">
                                <i class="fas fa-arrow-left me-2"></i>Back to login
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:if="${status == 'failed'}">
    <div class="col-12 col-lg-5">
        <div class="auth-form-container">
            <div class="auth-header text-center">
                <div class="error-icon mb-4">
                    <i class="fas fa-times-circle fa-4x text-danger"></i>
                </div>
                <h2>Reset Password Failed</h2>
                <p class="text-muted" th:text="${message}">Invalid or expired password reset token.</p>
            </div>

            <div class="d-grid gap-3 mt-4">
                <a href="/forgot-password" class="btn btn-primary">Request New Password Reset</a>
                <a href="/login" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Back to Login
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script th:src="@{/js/auth/reset-password.js}"></script>
</body>
</html>
