<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Registration System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/auth/login.css}">
</head>
<body>
<div class="notification-container" id="notificationContainer">
    <div class="notification success" id="errorNotification">
        <div class="notification-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="notification-content">
            <h4>Success!</h4>
            <p>Your account has been created successfully.</p>
        </div>
        <button class="notification-close" onclick="closeNotification()">
            <i class="fas fa-times"></i>
        </button>
        <div class="notification-progress"></div>
    </div>
</div>
<div class="container-fluid p-0 auth-container">
    <div class="row g-0">
        <!-- Image Section -->
        <div class="col-lg-7 d-none d-lg-block">
            <div class="image-container">
                <div class="overlay"></div>
                <div class="image-text">
                    <h1>Welcome to Student Portal</h1>
                    <p>Your journey to knowledge starts here</p>
                </div>
            </div>
        </div>

        <!-- Form Section -->
        <div class="col-12 col-lg-5">
            <div class="auth-form-container">
<!--                <div class="logo-container text-center">-->
<!--                    <img src="https://via.placeholder.com/80" alt="Logo" class="logo">-->
<!--                </div>-->
                <div class="auth-header">
                    <h2>Log In to Your Account</h2>
                    <p>Welcome back! Please enter your details</p>
                </div>
                <form action="/perform-login" id="loginForm" method="post">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control custom-input" id="username" name="username" placeholder="Username" required>
                        <label for="username">Username</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control custom-input" id="password" name="password" placeholder="Password" required>
                        <label for="password">Password</label>
                        <span class="password-toggle" onclick="togglePassword()">
                        <i class="far fa-eye"></i>
                    </span>
                    </div>

                    <div class="d-flex justify-content-between mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
                            <label class="form-check-label" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 auth-btn">Log In</button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register" class="register-link">Register now</a></p>
                </div>
                <div class="divider">
                    <span>or continue with</span>
                </div>
                <div class="social-login">
                    <button class="btn btn-google">
                        <img src="https://img.icons8.com/color/20/000000/google-logo.png" alt="Google">
                        <span>Log in with Google</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script th:src="@{/js/auth/login.js}"></script>
</body>
</html>
