<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verification</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/verify-account.css}">
</head>
<body>
<div class="verification-container animated">
    <div class="verification-header">
        <h2>Account Verification</h2>
    </div>

    <div class="verification-body">
        <!-- Success State -->
        <div th:if="${status == 'success'}">
            <div class="success-icon text-success">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3>Verification Successful!</h3>
            <p class="verification-message" th:text="${message}">Your account has been successfully verified!</p>
            <div class="d-grid gap-2">
                <a href="/login" class="btn btn-primary">Login to Your Account</a>
            </div>
        </div>

        <!-- Error State -->
        <div th:if="${status == 'failed'}">
            <div class="success-icon error-icon">
                <i class="fas fa-times-circle"></i>
            </div>
            <h3>Verification Failed</h3>
            <p class="verification-message" th:text="${message}">Invalid or expired verification token.</p>
            <div class="d-grid gap-2">
                <a href="/login" class="btn btn-primary">Return to Login</a>
            </div>
        </div>
    </div>

    <div class="verification-footer">
        <p class="mb-0">Need help? <a href="/contact">Contact Support</a></p>
    </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Add animated class on page load
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelector('.verification-container').classList.add('animated');
    });
</script>
</body>
</html>
