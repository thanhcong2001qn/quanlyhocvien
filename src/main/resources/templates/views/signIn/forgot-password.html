<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Student Registration System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/auth/login.css}">
</head>
<body>
<!-- Notification Container -->
<div class="notification-container" id="notificationContainer">
    <div class="notification success" id="successNotification">
        <div class="notification-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="notification-content">
            <h4>Success!</h4>
            <p>Login successfully.</p>
        </div>
        <button class="notification-close" onclick="closeNotification()">
            <i class="fas fa-times"></i>
        </button>
        <div class="notification-progress"></div>
    </div>
</div>
<div class="container-fluid p-0 auth-container">
    <div class="row g-0">
        <!-- Image Section -->
        <div class="col-lg-7 d-none d-lg-block">
            <div class="image-container">
                <div class="overlay"></div>
                <div class="image-text">
                    <h1>Reset Your Password</h1>
                    <p>We'll help you get back into your account</p>
                </div>
            </div>
        </div>

        <!-- Form Section -->
        <div class="col-12 col-lg-5">
            <div class="auth-form-container">
                <div class="auth-header">
                    <h2>Forgot Password</h2>
                    <p>Enter your email or username and we'll send you a link to reset your password</p>
                </div>
                <form id="forgotPasswordForm">
                    <div class="form-floating mb-4">
                        <input type="text" class="form-control custom-input" id="emailOrUsername"
                               placeholder="Email or Username" required>
                        <label for="emailOrUsername">Email or Username</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 auth-btn">Send Reset Link</button>

                    <div class="mt-4 text-center">
                        <a href="/login" class="back-link">
                            <i class="fas fa-arrow-left me-2"></i>Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth/forgot-password.js}"></script>
</body>
</html>
