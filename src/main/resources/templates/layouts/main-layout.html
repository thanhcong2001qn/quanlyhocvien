<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - Hệ thống quản lý">Trang</title>

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/chatbot/chatbot.css}">
    <!-- các file css dùng chung -->
    <link rel="stylesheet" th:href="@{/css/admin/header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/menu.css}">
    <link rel="stylesheet" th:href="@{/css/admin/body.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <th:block layout:fragment="style"></th:block>
</head>

<body>
<!-- Header, menu -->
<div th:replace="~{fragments/admin/header :: header}"></div>
<div th:replace="~{fragments/admin/menu :: menu}"></div>
<div th:replace="~{fragments/common/confirm-popup}"></div>

<!-- Chatbot -->
<div th:replace="~{fragments/chatbot/chatbot :: chatbot}"></div>

<!-- Nội dung trang cụ thể -->
<section layout:fragment="content"></section>

<!-- Scripts chung -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script th:src="@{/js/chatbot/chatbot.js}" defer></script>

<!-- Sidebar event handler -->
<script th:src="@{/js/admin/sidebar-handler.js}" defer></script>

<!-- Scripts riêng của từng trang -->
<th:block layout:fragment="script"></th:block>


<th:block th:replace="~{fragments/common/footer.html :: footer-scripts}"></th:block>

</body>
</html>
